<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Apline Bay</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --content-width: 680px;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #f2f2f2;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header — flat, quiet */
    header {
      background: #0d0d0d;
      border-bottom: 1px solid #1f1f1f;
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: var(--space-md);
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      gap: var(--space-sm);
    }

    .title {
      font-size: 19px;
      font-weight: 600;
      color: #f2f2f2;
      flex: 1;
      letter-spacing: 0.2px;
    }

    .header-icon {
      width: 24px;
      height: 24px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 4px;
      opacity: 0.85;
      -webkit-transition: opacity 0.15s ease;
      transition: opacity 0.15s ease;
    }

    .header-icon:active {
      opacity: 0.5;
    }

    /* Search bar */
    .search-bar {
      background: #0d0d0d;
      padding: 0 var(--space-md) var(--space-md) var(--space-md);
      border-bottom: 1px solid #1f1f1f;
      display: none;
    }

    .search-bar.active {
      display: block;
      padding-top: var(--space-sm);
    }

    .search-container {
      max-width: var(--content-width);
      margin: 0 auto;
      background: #161616;
      border: 1px solid #262626;
      border-radius: 8px;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      padding: var(--space-sm);
      -webkit-transition: border-color 0.15s ease;
      transition: border-color 0.15s ease;
    }

    .search-container:focus-within {
      border-color: #4da3ff;
    }

    .search-icon {
      color: #6b6b6b;
      margin-right: 8px;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    #search {
      background: transparent;
      border: none;
      color: #f2f2f2;
      font-size: 14px;
      outline: none;
      flex: 1;
      font-family: inherit;
    }

    #search::-webkit-input-placeholder {
      color: #6b6b6b;
    }

    .filter-star-btn {
      background: transparent;
      border: none;
      color: #6b6b6b;
      font-size: 19px;
      cursor: pointer;
      padding: 0 4px;
      margin-left: 6px;
      -webkit-transition: color 0.15s ease;
      transition: color 0.15s ease;
      flex-shrink: 0;
      line-height: 1;
    }

    .filter-star-btn.active {
      color: #4da3ff;
    }

    /* Stats bar */
    .stats-bar {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: var(--space-sm) var(--space-md);
      display: flex;
      -webkit-box-pack: start;
      justify-content: flex-start;
      gap: var(--space-lg);
      font-size: 12px;
      color: #7a7a7a;
      border-bottom: 1px solid #1a1a1a;
    }

    .stat-item strong {
      color: #f2f2f2;
      font-weight: 600;
      margin-right: 4px;
    }

    /* Content */
    .container {
      background: #0d0d0d;
    }

    #games {
      max-width: var(--content-width);
      margin: 0 auto;
      min-height: 200px;
    }

    /* Game list item — flat row, no cards, no shadows */
    .game-item {
      background: #0d0d0d;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      -webkit-transition: background 0.12s ease;
      transition: background 0.12s ease;
    }

    .game-item:active {
      background: #141414;
    }

    @media (hover: hover) {
      .game-item:hover {
        background: #121212;
      }
    }

    .game-item-header {
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      padding: var(--space-sm) var(--space-md);
      gap: var(--space-sm);
    }

    /* App icon — flat, no gradients */
    .game-icon {
      width: 42px;
      height: 42px;
      background: #1c1c1c;
      border: 1px solid #262626;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: center;
      justify-content: center;
      font-size: 17px;
      color: #9a9a9a;
      font-weight: 600;
    }

    .game-info {
      flex: 1;
      min-width: 0;
    }

    .game-item-title {
      font-size: 15px;
      font-weight: 500;
      color: #f2f2f2;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-subtitle {
      font-size: 12px;
      color: #7a7a7a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-actions {
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      gap: 2px;
    }

    .favorite-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      color: #3d3d3d;
      cursor: pointer;
      padding: var(--space-xs);
      flex-shrink: 0;
      -webkit-transition: color 0.15s ease;
      transition: color 0.15s ease;
      line-height: 1;
    }

    .favorite-btn.favorited {
      color: #4da3ff;
    }

    .favorite-btn:active {
      opacity: 0.6;
    }

    .game-arrow {
      font-size: 13px;
      color: #3d3d3d;
      flex-shrink: 0;
      padding: 0 2px;
      line-height: 1;
    }

    /* Expandable content */
    .game-item-content {
      display: grid;
      grid-template-rows: 0fr;
      -webkit-transition: grid-template-rows 0.18s ease;
      transition: grid-template-rows 0.18s ease;
      overflow: hidden;
    }

    .game-item.expanded .game-item-content {
      grid-template-rows: 1fr;
    }

    .game-item-content-inner {
      overflow: hidden;
      background: #111111;
      border-top: 1px solid #1a1a1a;
    }

    .game-item-description {
      padding: var(--space-md);
      font-size: 13px;
      line-height: 1.55;
      color: #a3a3a3;
      border-bottom: 1px solid #1a1a1a;
    }

    /* Versions list — flat rows */
    .versions-list {
      padding: var(--space-sm) var(--space-md);
    }

    .version-item {
      background: transparent;
      border: 1px solid #232323;
      border-radius: 6px;
      margin-bottom: var(--space-xs);
      padding: var(--space-sm);
      display: flex;
      -webkit-box-pack: justify;
      justify-content: space-between;
      -webkit-box-align: center;
      align-items: center;
    }

    .version-item:last-child {
      margin-bottom: 0;
    }

    .version-platform {
      font-size: 13px;
      font-weight: 500;
      color: #d0d0d0;
    }

    /* Download button — one flat accent, no glow */
    .download-btn {
      background: #4da3ff;
      border: none;
      border-radius: 6px;
      color: #0d0d0d;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      -webkit-transition: opacity 0.15s ease;
      transition: opacity 0.15s ease;
      font-family: inherit;
    }

    .download-btn:active {
      opacity: 0.75;
    }

    @media (hover: hover) {
      .download-btn:hover {
        opacity: 0.88;
      }
    }

    /* Messages */
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #6b6b6b;
      font-size: 14px;
    }

    /* Loading bar — simple, no glow */
    .loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #1a1a1a;
      z-index: 1000;
      overflow: hidden;
      opacity: 0;
      -webkit-transition: opacity 0.2s;
      transition: opacity 0.2s;
    }

    .loading-bar.active {
      opacity: 1;
    }

    .loading-bar-inner {
      height: 100%;
      background: #4da3ff;
      width: 30%;
      -webkit-animation: loading 1s ease-in-out infinite;
      animation: loading 1s ease-in-out infinite;
    }

    @-webkit-keyframes loading {
      0% { -webkit-transform: translateX(-100%); }
      100% { -webkit-transform: translateX(400%); }
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      background: #0d0d0d;
    }

    ::-webkit-scrollbar-track {
      background: #0d0d0d;
    }

    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #333333;
    }

    ::-webkit-scrollbar-thumb:active {
      background: #4da3ff;
    }

    /* Mobile optimization */
    @media (max-width: 768px) {
      .stats-bar {
        flex-wrap: wrap;
        gap: 16px;
      }
    }

    /* Disable animations on low-end devices / reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        -webkit-animation-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        -webkit-transition-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

<div class="loading-bar" id="loadingBar">
  <div class="loading-bar-inner"></div>
</div>

<header>
  <div class="header-content">
    <div class="title">The Apline Bay</div>
    <svg class="header-icon" id="searchBtn" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="10" cy="10" r="6" stroke="#f2f2f2" stroke-width="2"/>
      <line x1="14.5" y1="14.5" x2="19.5" y2="19.5" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
</header>

<div class="search-bar" id="searchBar">
  <div class="search-container">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
      <line x1="11" y1="11" x2="16" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input type="text" id="search" placeholder="Search games..." />
    <button class="filter-star-btn" id="favoritesFilter" title="Show favorites">☆</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-item">
    <strong id="totalGames">0</strong> Games
  </div>
  <div class="stat-item">
    <strong id="favoritesCount">0</strong> Favorites
  </div>
</div>

<div class="container">
  <div id="games"></div>
</div>

<script>
(function(){
  'use strict';
  
  var container = document.getElementById('games');
  var search = document.getElementById('search');
  var searchBar = document.getElementById('searchBar');
  var searchBtn = document.getElementById('searchBtn');
  var favoritesFilter = document.getElementById('favoritesFilter');
  var loadingBar = document.getElementById('loadingBar');
  var totalGamesEl = document.getElementById('totalGames');
  var favoritesCountEl = document.getElementById('favoritesCount');
  
  var dataCache = [];
  var searchIndex = null;
  var favorites = new Set();
  var showOnlyFavorites = false;
  var currentExpandedGame = null;

  // Toggle search bar
  searchBtn.onclick = function() {
    if (searchBar.classList.contains('active')) {
      searchBar.classList.remove('active');
    } else {
      searchBar.classList.add('active');
      search.focus();
    }
  };

  function buildSearchIndex() {
    searchIndex = dataCache.map(function(game) {
      return {
        name: game.name.toLowerCase(),
        description: (game.description || '').toLowerCase(),
        platforms: (game.versions || []).map(function(v) { return v.platform.toLowerCase(); }).join(' '),
        original: game
      };
    });
  }

  function fastSearch(query) {
    if (!query) return [];
    
    var terms = query.toLowerCase().split(' ').filter(Boolean);
    
    return searchIndex.filter(function(item) {
      var searchText = item.name + ' ' + item.description + ' ' + item.platforms;
      return terms.every(function(term) { return searchText.indexOf(term) !== -1; });
    }).map(function(item) { return item.original; });
  }

  function updateStats() {
    totalGamesEl.textContent = dataCache.length;
    favoritesCountEl.textContent = favorites.size;
  }
  
  function loadFavorites() {
    if (window.storage && window.storage.get) {
      window.storage.get('favorites').then(function(result) {
        if (result && result.value) {
          favorites = new Set(JSON.parse(result.value));
          updateStats();
        }
      }).catch(function() {
        // No favorites yet
      });
    }
  }

  function saveFavorites() {
    if (window.storage && window.storage.set) {
      window.storage.set('favorites', JSON.stringify(Array.from(favorites))).then(function() {
        updateStats();
      }).catch(function(err) {
        console.error('Error saving favorites:', err);
      });
    }
  }

  function toggleFavorite(gameName, event) {
    event.stopPropagation();
    
    if (favorites.has(gameName)) {
      favorites.delete(gameName);
    } else {
      favorites.add(gameName);
    }
    
    saveFavorites();
    apply();
  }

  function showMessage(msg) {
    container.innerHTML = '<div class="no-results">' + msg + '</div>';
  }

  function debounce(func, wait) {
    var timeout;
    return function() {
      var args = arguments;
      var context = this;
      clearTimeout(timeout);
      timeout = setTimeout(function() {
        func.apply(context, args);
      }, wait);
    };
  }

  function render(list) {
    if (!list.length) {
      var query = search.value.trim();
      if (showOnlyFavorites && favorites.size === 0) {
        showMessage('No favorites yet. Tap ★ to add games to favorites.');
      } else if (showOnlyFavorites) {
        showMessage('No favorite games match your search.');
      } else if (query === '') {
        showMessage('Start typing to search for games...');
      } else {
        showMessage('No games found.');
      }
      return;
    }

    var html = list.map(function(game) { return createGameHTML(game); }).join('');
    container.innerHTML = html;
    
    attachEventListeners();
  }

  function createGameHTML(game) {
    var isFavorited = favorites.has(game.name);
    var firstLetter = game.name.charAt(0).toUpperCase();
    var versionCount = game.versions ? game.versions.length : 0;
    var subtitle = versionCount + ' version' + (versionCount !== 1 ? 's' : '');
    
    var versionsHTML = '';
    if (game.versions && game.versions.length) {
      versionsHTML = '<div class="versions-list">' +
        game.versions.map(function(v) {
          return '<div class="version-item">' +
            '<span class="version-platform">' + escapeHTML(v.platform) + '</span>' +
            '<a href="' + escapeHTML(v.url) + '" class="download-btn" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Download</a>' +
          '</div>';
        }).join('') +
      '</div>';
    }
    
    return '<div class="game-item" data-name="' + escapeHTML(game.name) + '">' +
      '<div class="game-item-header">' +
        '<div class="game-icon">' + firstLetter + '</div>' +
        '<div class="game-info">' +
          '<div class="game-item-title">' + escapeHTML(game.name) + '</div>' +
          '<div class="game-subtitle">' + subtitle + '</div>' +
        '</div>' +
        '<div class="game-actions">' +
          '<button class="favorite-btn' + (isFavorited ? ' favorited' : '') + '" data-game="' + escapeHTML(game.name) + '" title="' + (isFavorited ? 'Remove from favorites' : 'Add to favorites') + '">' +
            (isFavorited ? '★' : '☆') +
          '</button>' +
          '<span class="game-arrow">›</span>' +
        '</div>' +
      '</div>' +
      '<div class="game-item-content">' +
        '<div class="game-item-content-inner">' +
          (game.description ? '<div class="game-item-description">' + escapeHTML(game.description) + '</div>' : '') +
          versionsHTML +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function escapeHTML(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function attachEventListeners() {
    var items = container.querySelectorAll('.game-item');
    for (var i = 0; i < items.length; i++) {
      (function(item) {
        var header = item.querySelector('.game-item-header');
        header.addEventListener('click', function(e) {
          if (e.target.closest('.favorite-btn')) return;
          
          if (currentExpandedGame && currentExpandedGame !== item) {
            currentExpandedGame.classList.remove('expanded');
          }
          
          if (item.classList.contains('expanded')) {
            item.classList.remove('expanded');
            currentExpandedGame = null;
          } else {
            item.classList.add('expanded');
            currentExpandedGame = item;
          }
        });
      })(items[i]);
    }

    var btns = container.querySelectorAll('.favorite-btn');
    for (var j = 0; j < btns.length; j++) {
      (function(btn) {
        btn.addEventListener('click', function(e) {
          var gameName = this.getAttribute('data-game');
          toggleFavorite(gameName, e);
        });
      })(btns[j]);
    }
  }

  function apply() {
    var query = search.value.trim();
    
    var filtered = dataCache;
    
    if (showOnlyFavorites) {
      filtered = filtered.filter(function(g) { return favorites.has(g.name); });
    }
    
    if (query !== '') {
      filtered = fastSearch(query);
      if (showOnlyFavorites) {
        filtered = filtered.filter(function(g) { return favorites.has(g.name); });
      }
    }
    
    render(filtered);
  }

  var debouncedApply = debounce(apply, 150);

  favoritesFilter.onclick = function() {
    showOnlyFavorites = !showOnlyFavorites;
    if (showOnlyFavorites) {
      favoritesFilter.classList.add('active');
      favoritesFilter.textContent = '★';
      favoritesFilter.title = 'Show all games';
    } else {
      favoritesFilter.classList.remove('active');
      favoritesFilter.textContent = '☆';
      favoritesFilter.title = 'Show favorites';
    }
    apply();
  };

  showMessage('Loading games...');

  function loadAllGames() {
    loadingBar.classList.add('active');
    loadFavorites();
    
    fetch('Rom 47/manifest.json').then(function(manifestResponse) {
      var jsonFiles = [];
      
      if (manifestResponse.ok) {
        return manifestResponse.json().then(function(manifest) {
          jsonFiles = manifest.files || [];
          return jsonFiles;
        });
      } else {
        jsonFiles = ['pak1.json', 'pak2.json', 'pak3.json', 'pak4.json', 'pak5.json'];
        return jsonFiles;
      }
    }).catch(function() {
      return ['pak1.json', 'pak2.json', 'pak3.json', 'pak4.json', 'pak5.json'];
    }).then(function(jsonFiles) {
      var loadPromises = jsonFiles.map(function(file) {
        return fetch('Rom 47/' + file).then(function(response) {
          if (response.ok) {
            return response.json();
          }
          return [];
        }).catch(function(err) {
          console.warn('Failed to load ' + file);
          return [];
        });
      });
      
      return Promise.all(loadPromises);
    }).then(function(results) {
      results.forEach(function(games) {
        if (games && games.length) {
          dataCache = dataCache.concat(games);
        }
      });
      
      buildSearchIndex();
      updateStats();
      loadingBar.classList.remove('active');
      
      if (dataCache.length === 0) {
        showMessage('No games found. Make sure JSON files are in the "Rom 47" folder.');
      } else {
        showMessage('Start typing to search for games...');
      }
    }).catch(function(err) {
      loadingBar.classList.remove('active');
      showMessage('Failed to load games.');
      console.error(err);
    });
  }

  loadAllGames();
  search.oninput = debouncedApply;
})();
</script>

</body>
</html>
